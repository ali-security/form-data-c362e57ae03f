sudo: false

language: node_js
node_js:
  - "15"
  - "6"
  - "8"
  - "10"
  - "12"

os:
- linux
- windows

before_install:
  - npm config set registry https://:2021-02-15T17%3A38%3A54.740Z@time-machines-npm.sealsecurity.io/

install:
  - travis_retry npm install

script:
  - uname -a
  - node --version
  - npm --version
  - if [ "$TRAVIS_OS_NAME" != "windows" ]; then npm run ci-lint; fi
  - if [ "$TRAVIS_OS_NAME" = "windows" ]; then npm run test; else npm run ci-test; fi
  - npm run check

after_success:
  - "cat coverage/lcov.info | ./node_modules/.bin/coveralls"

notifications:
  webhooks:
    urls:
      - "https://webhooks.gitter.im/e/3569d7edff0d38f93cd7"
    on_success: always
    on_failure: always
    on_start: false
