name: seal-build

on:
  workflow_dispatch: {}

jobs:
  pack:
    name: Build and pack the npm tarball
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '15'

      - name: Show toolchain
        run: |
          node --version
          npm --version

      - name: Apply update-readme badge rewrite and leave the .bak
        run: |
          VERSION=$(node -e "console.log(require('./package.json').version)")
          sed -i "s#/master\.svg#/v${VERSION}.svg#g" Readme.md
          cp Readme.md README.md.bak

      - name: Pack the release tarball
        run: npm pack --ignore-scripts

      - name: Upload the npm tarball
        uses: actions/upload-artifact@v4
        with:
          name: npm-tarball
          path: form-data-*.tgz
          if-no-files-found: error
